<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #c4b5fd;
    }

    .hint {
      margin-bottom: 32px;
      font-size: 13px;
      color: #888;
    }

    .piano {
      display: flex;
      position: relative;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .key {
      position: relative;
      cursor: pointer;
      transition: background 0.05s, box-shadow 0.05s, transform 0.05s;
    }

    .key .label {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .key .note-name {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      pointer-events: none;
      opacity: 0.4;
    }

    .white {
      width: 52px;
      height: 200px;
      background: linear-gradient(to bottom, #f8f8f8, #fff);
      border: 1px solid #ccc;
      border-radius: 0 0 5px 5px;
      z-index: 1;
    }

    .white .label { color: #666; }
    .white .note-name { color: #999; }

    .white:hover { background: linear-gradient(to bottom, #f0f0f0, #f5f5f5); }

    .white.active {
      background: linear-gradient(to bottom, #c4b5fd, #a78bfa) !important;
      transform: scaleY(0.98);
      transform-origin: top;
      box-shadow: 0 2px 8px rgba(167, 139, 250, 0.5);
    }

    .black {
      width: 34px;
      height: 130px;
      background: linear-gradient(to bottom, #333, #111);
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      position: absolute;
      z-index: 2;
      margin-left: -17px;
    }

    .black .label { color: #aaa; bottom: 10px; font-size: 10px; }
    .black .note-name { color: #888; bottom: 26px; font-size: 9px; }

    .black:hover { background: linear-gradient(to bottom, #444, #222); }

    .black.active {
      background: linear-gradient(to bottom, #7c3aed, #5b21b6) !important;
      transform: scaleY(0.97);
      transform-origin: top;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.5);
    }

    .octave {
      display: flex;
      position: relative;
    }

    .active-notes {
      margin-top: 32px;
      font-size: 14px;
      color: #a78bfa;
      min-height: 24px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>Piano</h1>
  <p class="hint">Press keys on your keyboard to play</p>
  <div class="piano" id="piano"></div>
  <div class="active-notes" id="active-notes"></div>

  <script>
    const NOTE_FREQS = {
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56,
      'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00,
      'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
      'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
      'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25,
    };

    const KEY_MAP = {
      'a': 'C3', 'w': 'C#3', 's': 'D3', 'e': 'D#3', 'd': 'E3',
      'f': 'F3', 't': 'F#3', 'g': 'G3', 'y': 'G#3', 'h': 'A3',
      'u': 'A#3', 'j': 'B3',
      'k': 'C4', 'o': 'C#4', 'l': 'D4', 'p': 'D#4', ';': 'E4',
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const activeOscillators = {};
    const activeKeys = new Set();

    function createPiano() {
      const piano = document.getElementById('piano');

      const keysByNote = {};
      for (const [kb, note] of Object.entries(KEY_MAP)) {
        keysByNote[note] = kb;
      }

      const layout = [
        { note: 'C3', type: 'white' }, { note: 'C#3', type: 'black' },
        { note: 'D3', type: 'white' }, { note: 'D#3', type: 'black' },
        { note: 'E3', type: 'white' },
        { note: 'F3', type: 'white' }, { note: 'F#3', type: 'black' },
        { note: 'G3', type: 'white' }, { note: 'G#3', type: 'black' },
        { note: 'A3', type: 'white' }, { note: 'A#3', type: 'black' },
        { note: 'B3', type: 'white' },
        { note: 'C4', type: 'white' }, { note: 'C#4', type: 'black' },
        { note: 'D4', type: 'white' }, { note: 'D#4', type: 'black' },
        { note: 'E4', type: 'white' },
      ];

      let whiteIndex = 0;
      layout.forEach(({ note, type }) => {
        const el = document.createElement('div');
        el.className = `key ${type}`;
        el.dataset.note = note;

        const noteName = document.createElement('span');
        noteName.className = 'note-name';
        noteName.textContent = note;
        el.appendChild(noteName);

        if (keysByNote[note]) {
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = keysByNote[note] === ';' ? ';' : keysByNote[note];
          el.appendChild(label);
        }

        if (type === 'white') {
          el.style.marginLeft = whiteIndex === 0 ? '0' : '0';
          piano.appendChild(el);
          whiteIndex++;
        } else {
          const whiteWidth = 52;
          const offset = whiteIndex * whiteWidth;
          el.style.left = offset + 'px';
          piano.appendChild(el);
        }
      });
    }

    function playNote(note) {
      if (activeOscillators[note]) return;

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.value = NOTE_FREQS[note];

      filter.type = 'lowpass';
      filter.frequency.value = 2000;

      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();

      activeOscillators[note] = { osc, gain };

      const el = document.querySelector(`.key[data-note="${note}"]`);
      if (el) el.classList.add('active');

      activeKeys.add(note);
      updateActiveNotes();
    }

    function stopNote(note) {
      const entry = activeOscillators[note];
      if (!entry) return;

      const { osc, gain } = entry;
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
      setTimeout(() => osc.stop(), 200);
      delete activeOscillators[note];

      const el = document.querySelector(`.key[data-note="${note}"]`);
      if (el) el.classList.remove('active');

      activeKeys.delete(note);
      updateActiveNotes();
    }

    function updateActiveNotes() {
      const display = document.getElementById('active-notes');
      display.textContent = activeKeys.size
        ? [...activeKeys].join('  ')
        : '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const note = KEY_MAP[e.key.toLowerCase()];
      if (note) {
        e.preventDefault();
        playNote(note);
      }
    });

    document.addEventListener('keyup', (e) => {
      const note = KEY_MAP[e.key.toLowerCase()];
      if (note) stopNote(note);
    });

    document.addEventListener('mousedown', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      playNote(key.dataset.note);

      const onUp = () => {
        stopNote(key.dataset.note);
        document.removeEventListener('mouseup', onUp);
      };
      document.removeEventListener('mouseup', onUp);
      document.addEventListener('mouseup', onUp);
    });

    createPiano();
  </script>
</body>
</html>
