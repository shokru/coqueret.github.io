# Quarto config for gcoqueret.com
# Render with:  quarto render   (or the Render button in RStudio)
# A new page: create the .qmd file and add it to the render list below.
# Pages are written next to their source (output-dir: .), so GitHub Pages
# keeps serving the repository root exactly as before.

project:
  type: website
  output-dir: .
  render:            # only these pages are built; notebooks and slides under files/ are never touched
    - index.qmd
    - research.qmd
    - teaching.qmd
    - ml_factor.qmd
    - macro.qmd
    - rstats.qmd
    - shiny.qmd
    - PRs.qmd
    - horizons.qmd
    - tot.qmd

format:
  html:
    minimal: true                 # no Bootstrap: the look comes from assets/site.css
    css: assets/site.css
    include-in-header: _partials/head.html
    include-before-body: _partials/header.html
    include-after-body: _partials/footer.html
